<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent Office · Sign in</title>
    <link rel="icon" href="/favicon.svg" />
    <link rel="stylesheet" href="./login.css" />
  </head>
  <body>
    <main class="card">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 64 64" width="72" height="72"><rect x="6" y="30" width="52" height="8" rx="3" fill="#e0a96d"/><rect x="18" y="14" width="28" height="18" rx="3" fill="#2b2d42"/><rect x="21" y="17" width="22" height="12" rx="1" fill="#7cf29a"/><circle cx="32" cy="50" r="9" fill="#ff8a5b"/><circle cx="29" cy="48" r="1.8" fill="#222"/><circle cx="35" cy="48" r="1.8" fill="#222"/></svg>
      </div>
      <h1>Agent Office</h1>
      <div class="tabs" id="tabs" role="tablist">
        <button type="button" role="tab" id="tab-signin" aria-selected="true">Sign in</button>
        <button type="button" role="tab" id="tab-register" aria-selected="false">Register</button>
      </div>
      <p class="sub" id="sub">Knock knock. Who is it?</p>
      <form id="form">
        <label>Your name<input id="name" type="text" maxlength="24" autocomplete="username" spellcheck="false" required autofocus /></label>
        <label>Password<input id="password" type="password" autocomplete="current-password" required /></label>
        <label id="office-row" hidden>Office password<input id="office-password" type="password" autocomplete="off" /></label>
        <p id="note" class="note" hidden></p>
        <button type="submit" id="submit">Come on in</button>
        <p id="error" class="error" role="alert"></p>
      </form>
    </main>
    <script type="module" src="./login.ts"></script>
  </body>
</html>
